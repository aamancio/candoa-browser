<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's new in Talos</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1a1a1a; --muted: #6b6b66; --line: #e4e4df; --accent: #1f4b99; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131313; --fg: #ededea; --muted: #9a9a94; --line: #2a2a2a; --accent: #7fa7ff; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 42rem; margin: 0 auto; padding: 4rem 1.25rem; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
    .lede { color: var(--muted); margin: 0 0 2.5rem; }
    .lede a { color: inherit; }
    section { padding: 1.5rem 0; border-top: 1px solid var(--line); }
    section h2 { font-size: 1.2rem; margin: 0 0 0.2rem; }
    section time { color: var(--muted); font-size: 0.95rem; }
    section h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 1rem 0 0.25rem; }
    ul { padding-left: 1.2rem; margin: 0; }
    li { margin: 0.3rem 0; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>What's new</h1>
  <p class="lede">Every Talos release, newest first. <a href="../">Back to Talos</a></p>
  <!-- releases:start -->
  <p class="empty">The first Talos release under this name has not shipped yet. Older builds were published as Candoa Browser.</p>
  <!-- releases:end -->
</main>
</body>
</html>
