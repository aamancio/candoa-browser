name: Release

# Every push to main that changes the app ships a release: build, sign,
# notarize, attach the DMG to a GitHub Release, sign the Sparkle appcast,
# commit the appcast, latest.json, and What's New entry into site/, and then
# dispatch the Pages workflow to publish them (a push made with the workflow
# token never triggers other workflows on its own). Gated on the
# TALOS_RELEASES_ENABLED repository variable so the pipeline stays quiet until
# signing is ready. A change to this file alone does not ship a version; run
# it by hand from the Actions tab when that is what you want.

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    if: ${{ vars.TALOS_RELEASES_ENABLED == 'true' }}
    runs-on: macos-latest
    env:
      APP_DMG: ${{ github.workspace }}/artifacts/Talos.dmg
      APP_BUNDLE: ${{ github.workspace }}/build/DerivedData/Build/Products/Release/Talos.app
      EXPECTED_APP_BUNDLE_IDENTIFIER: app.candoa.browser
      SPARKLE_VERSION: 2.10.0
      CODE_SIGN_IDENTITY: Developer ID Application
      SITE_URL: https://talos-browser.app
      RELEASE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download

    steps:
      - name: Check out Talos
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive build number and marketing version
        run: |
          echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          # feat → minor, anything else → patch; the major digit is never bumped here.
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            VERSION="$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);.*/\1/p' Talos.xcodeproj/project.pbxproj | head -1)"
          else
            BASE="${LAST_TAG#v}"
            MAJOR="${BASE%%.*}"; REST="${BASE#*.}"
            MINOR="${REST%%.*}"; PATCH="${REST#*.}"
            if git log --format=%s "$LAST_TAG..HEAD" | grep -qE '^feat(\(|!|:)'; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          echo "APP_MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "LAST_RELEASE_TAG=$LAST_TAG" >> "$GITHUB_ENV"
          echo "Version $VERSION (build $(git rev-list --count HEAD)), previous tag: ${LAST_TAG:-none}"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Talos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate release secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID DEVELOPER_ID_CERTIFICATE_BASE64 DEVELOPER_ID_CERTIFICATE_PASSWORD \
            DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 APPLE_NOTARY_KEY_BASE64 APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "$name secret is required." >&2; missing=1; fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/talos-signing.keychain-db"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          CERT="$RUNNER_TEMP/developer-id.p12"
          PW="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          security import "$CERT" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install Developer ID provisioning profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE="$RUNNER_TEMP/talos-developer-id.provisionprofile"
          PLIST="$RUNNER_TEMP/talos-developer-id.plist"
          printf '%s' "$DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")"
          TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")"
          APPID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$PLIST")"
          ALLDEV="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$PLIST")"
          [ "$TEAM" = "$APPLE_TEAM_ID" ] || { echo "Profile team $TEAM, expected $APPLE_TEAM_ID." >&2; exit 1; }
          [ "$APPID" = "$APPLE_TEAM_ID.$EXPECTED_APP_BUNDLE_IDENTIFIER" ] || { echo "Profile is for $APPID." >&2; exit 1; }
          [ "$ALLDEV" = "true" ] || { echo "Profile must be a Developer ID distribution profile." >&2; exit 1; }
          for CAP in com.apple.developer.associated-domains com.apple.developer.icloud-services \
            com.apple.developer.web-browser.public-key-credential; do
            /usr/libexec/PlistBuddy -c "Print :Entitlements:$CAP" "$PLIST" >/dev/null 2>&1 \
              || { echo "Provisioning profile must allow $CAP. Regenerate it in the developer portal." >&2; exit 1; }
          done
          CONTAINER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers:0' "$PLIST" 2>/dev/null || true)"
          [ "$CONTAINER" = "iCloud.app.candoa.browser" ] || { echo "Profile must allow iCloud.app.candoa.browser." >&2; exit 1; }
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"; cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          echo "PROVISIONING_PROFILE_SPECIFIER=$UUID" >> "$GITHUB_ENV"

      - name: Build Release app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project Talos.xcodeproj \
            -scheme Talos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            MARKETING_VERSION="$APP_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            build

      - name: Re-sign Sparkle helpers and the app
        run: |
          FW="$APP_BUNDLE/Contents/Frameworks/Sparkle.framework"
          V="$FW/Versions/B"
          ENT="build/DerivedData/Build/Intermediates.noindex/Talos.build/Release/Talos.build/Talos.app.xcent"
          for T in "$V/Autoupdate" "$V/XPCServices/Downloader.xpc" "$V/XPCServices/Installer.xpc" "$V/Updater.app" "$FW"; do
            codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime "$T"
          done
          codesign --force --sign "$CODE_SIGN_IDENTITY" --timestamp --options runtime --entitlements "$ENT" "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Verify entitlement policy
        run: |
          SIGNED="$(codesign -d --entitlements - --xml "$APP_BUNDLE")"
          printf '%s' "$SIGNED" | plutil -p -
          if printf '%s' "$SIGNED" | grep -F -q "com.apple.developer.applesignin"; then
            echo "Forbidden entitlement com.apple.developer.applesignin present in the signed app." >&2; exit 1
          fi
          if ! printf '%s' "$SIGNED" | grep -F -q "com.apple.developer.web-browser.public-key-credential"; then
            echo "The signed app is missing the browser passkey entitlement." >&2; exit 1
          fi

      - name: Package DMG
        run: |
          mkdir -p artifacts
          chmod +x Scripts/package_dmg.sh
          Scripts/package_dmg.sh "$APP_BUNDLE" "$APP_DMG"
          shasum -a 256 "$APP_DMG"

      - name: Sign, notarize, and staple DMG
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$APPLE_NOTARY_KEY_ID.p8"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$KEY"
          codesign --sign "$CODE_SIGN_IDENTITY" --timestamp "$APP_DMG"
          codesign --verify --verbose=2 "$APP_DMG"
          xcrun notarytool submit "$APP_DMG" --key "$KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$APP_DMG"
          xcrun stapler validate "$APP_DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$APP_DMG"

      - name: Read the app's identity and version
        run: |
          V="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Contents/Info.plist")"
          B="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Contents/Info.plist")"
          ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_BUNDLE/Contents/Info.plist")"
          [ "$ID" = "$EXPECTED_APP_BUNDLE_IDENTIFIER" ] || { echo "Expected $EXPECTED_APP_BUNDLE_IDENTIFIER, got $ID." >&2; exit 1; }
          {
            echo "APP_VERSION=$V"
            echo "APP_BUILD=$B"
            echo "APP_TAG=v$V"
            echo "APP_ARCHIVE_NAME=Talos-$V.dmg"
          } >> "$GITHUB_ENV"

      - name: Tag and publish the GitHub Release with the DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$APP_DMG" "artifacts/$APP_ARCHIVE_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$APP_TAG"
          git push origin "$APP_TAG"
          gh release create "$APP_TAG" "artifacts/$APP_ARCHIVE_NAME" \
            --title "Talos $APP_VERSION" \
            --notes "Talos $APP_VERSION (build $APP_BUILD). Signed and notarized. Release notes: $SITE_URL/whats-new/"

      - name: Install Sparkle tools
        run: |
          TOOLS="$RUNNER_TEMP/sparkle-tools"
          echo "SPARKLE_TOOLS=$TOOLS" >> "$GITHUB_ENV"
          curl -L --fail "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o "$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir -p "$TOOLS"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$TOOLS" --strip-components=1
          "$TOOLS/bin/generate_appcast" --help >/dev/null

      - name: Write the appcast, latest.json, and the release notes into site/
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          DIR="$(mktemp -d)"
          cp "artifacts/$APP_ARCHIVE_NAME" "$DIR/"
          printf '# Talos %s\n\nSee %s/whats-new/\n' "$APP_VERSION" "$SITE_URL" > "$DIR/Talos-$APP_VERSION.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_TOOLS/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$RELEASE_DOWNLOAD_BASE/$APP_TAG/" \
            --link "$SITE_URL" \
            --maximum-versions 1 \
            --embed-release-notes \
            -o "$DIR/appcast.xml" \
            "$DIR"
          mkdir -p site/public/downloads
          cp "$DIR/appcast.xml" site/public/downloads/appcast.xml

          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import date
          from pathlib import Path

          v = os.environ["APP_VERSION"]; tag = os.environ["APP_TAG"]
          base = os.environ["RELEASE_DOWNLOAD_BASE"]; site = os.environ["SITE_URL"]
          name = os.environ["APP_ARCHIVE_NAME"]; last = os.environ.get("LAST_RELEASE_TAG", "")

          Path("site/public/downloads/latest.json").write_text(json.dumps({
              "version": v,
              "build": os.environ["APP_BUILD"],
              "bundleIdentifier": os.environ["EXPECTED_APP_BUNDLE_IDENTIFIER"],
              "fileName": name,
              "downloadURL": f"{base}/{tag}/{name}",
              "appcastURL": f"{site}/downloads/appcast.xml",
              "releaseNotesURL": f"{site}/whats-new/",
          }, indent=2) + "\n")

          rng = f"{last}..HEAD" if last else "HEAD"
          subjects = subprocess.run(["git", "log", "--no-merges", "--format=%s", rng],
                                    capture_output=True, text=True, check=True).stdout.splitlines()
          conv = re.compile(r"^(feat|fix|perf)(\([^)]*\))?!?:\s*(.+?)\s*(\(#\d+\))?\s*$")
          feats, fixes = [], []
          for s in subjects:
              m = conv.match(s.strip())
              if not m: continue
              kind, _, text, _ = m.groups()
              (feats if kind == "feat" else fixes).append(text[0].upper() + text[1:])
          p = Path("site/content/releases.json")
          releases = [r for r in json.loads(p.read_text()) if r.get("version") != v]
          releases.insert(0, {"version": v, "date": date.today().isoformat(), "new": feats, "fixed": fixes})
          p.write_text(json.dumps(releases, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Commit the site changes
        run: |
          git add site/public/downloads/appcast.xml site/public/downloads/latest.json site/content/releases.json
          git commit -m "release: Talos $APP_VERSION appcast and notes"
          git push origin HEAD:main

      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
