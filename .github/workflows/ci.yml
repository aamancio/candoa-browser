name: Talos CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      only_testing:
        description: >-
          Comma-separated -only-testing specs
          (e.g. TalosUITests/TalosUITests/testName) to restrict the E2E run
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: talos-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static Quality Gate
    runs-on: macos-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_testing != '') }}
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install quality tools
        run: |
          command -v rg >/dev/null 2>&1 || brew install ripgrep
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
      - name: Run quality checks
        run: Scripts/quality-check.sh

  build:
    name: Debug Build
    runs-on: macos-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_testing != '') }}
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Talos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Build app
        run: |
          xcodebuild \
            -project Talos.xcodeproj \
            -scheme Talos \
            -configuration Debug \
            -destination platform=macOS \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build
      # Reads the compiler-emitted .stringsdata from DerivedData, so it runs after the build.
      - name: Check string-catalog coverage
        run: Scripts/check-localization.py build/DerivedData

  e2e:
    name: Manual Native macOS E2E
    runs-on: macos-latest
    # Manual only. The nightly schedule from the Candoa days is gone; dispatch it when a change touches the UI.
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: [quality, build]
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Talos.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Run XCTest UI suite
        env:
          TALOS_E2E_ADHOC_SIGNING: "1"
          TALOS_DERIVED_DATA_PATH: build/DerivedData
          TALOS_E2E_ONLY_TESTING: ${{ inputs.only_testing }}
        run: Scripts/e2e-test.sh
      - name: Summarize test results
        if: always()
        run: Scripts/e2e-failure-summary.sh build/DerivedData/Logs/Test
      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talos-e2e-xcresult
          path: build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
